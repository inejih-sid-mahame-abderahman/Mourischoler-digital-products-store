<style>
  :root{
    --ink:#111827; --ink-soft:#4B5563; --cream:#FDFBF6; --surface:#F9FAFB; --border:#E5E7EB;
    --orange:#F97316; --amber:#FB923C; --gold:#D4AF37; --blue:#2563EB; --success:#22C55E; --white:#FFFFFF;

  }
  body.lang-ar{ --font-head:'Cairo', sans-serif; --font-body:'Cairo', sans-serif; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--font-body); color:var(--ink); background:var(--cream); -webkit-font-smoothing:antialiased; }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  button,input,select{font-family:inherit;}
  h1,h2,h3,h4{font-family:var(--font-head); margin:0; letter-spacing:-0.02em; line-height:1.1;}
  p{margin:0;}
  .wrap{max-width:var(--container); margin:0 auto; padding:0 28px;}
  .icon{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

  /* NAV (shared) */
  header{ position:sticky; top:0; z-index:100; background:rgba(253,251,246,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; height:78px; }
  .brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-head); font-weight:800; font-size:1.28rem; }
  .brand-mark{ width:34px; height:34px; border-radius:9px; background:linear-gradient(140deg,var(--orange),var(--amber)); display:flex; align-items:center; justify-content:center; color:#fff; }
  .brand-mark svg{width:19px;height:19px;}
  .nav-links{ display:flex; align-items:center; gap:34px; font-size:0.95rem; font-weight:600; color:var(--ink-soft); }
  .nav-links a.active{ color:var(--ink); }
  .nav-links a:hover{ color:var(--ink); }
  .nav-right{ display:flex; align-items:center; gap:16px; }
  .lang-switch{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; }
  .lang-switch button{ border:none; background:transparent; padding:6px 12px; border-radius:999px; font-size:0.8rem; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .lang-switch button.active{ background:var(--ink); color:#fff; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:11px; font-weight:700; font-size:0.93rem; border:1.5px solid transparent; white-space:nowrap; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--orange); color:#fff; box-shadow:0 8px 20px -8px rgba(249,115,22,0.6); }
  .btn-primary:hover{ background:#EA6A0E; }
  .btn-outline{ background:transparent; border:1.5px solid var(--border); color:var(--ink); }
  .btn-outline:hover{ background:var(--surface); }
  .btn-dark{ background:var(--ink); color:#fff; }
  .btn-dark:hover{ background:#0a0f1a; }

  /* PAGE HEAD */
  .page-head{ padding:56px 0 40px; border-bottom:1px solid var(--border); }
  .crumb{ font-size:0.85rem; color:var(--ink-soft); margin-bottom:14px; display:flex; align-items:center; gap:6px; }
  .crumb .cur{ color:var(--ink); font-weight:600; }
  .page-head h1{ font-size:2.4rem; font-weight:800; margin-bottom:10px; }
  .page-head p{ color:var(--ink-soft); font-size:1.02rem; max-width:600px; }

  /* LAYOUT */
  .browse{ padding:44px 0 90px; display:grid; grid-template-columns:260px 1fr; gap:44px; align-items:start; }
  .filters{ position:sticky; top:98px; }
  .filter-block{ padding-bottom:26px; margin-bottom:26px; border-bottom:1px solid var(--border); }
  .filter-block:last-child{ border-bottom:none; }
  .filter-block h4{ font-size:0.85rem; font-weight:700; margin-bottom:14px; text-transform:none; }
  .search-box{ display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:11px 14px; }
  .search-box input{ border:none; outline:none; font-size:0.92rem; width:100%; background:transparent; }
  .search-box svg{ color:var(--ink-soft); }
  .chip-list{ display:flex; flex-direction:column; gap:4px; }
  .chip-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 10px; border-radius:9px; font-size:0.9rem; color:var(--ink-soft); cursor:pointer; font-weight:500; }
  .chip-row:hover{ background:var(--surface); }
  .chip-row.active{ background:rgba(249,115,22,0.09); color:var(--orange); font-weight:700; }
  .chip-row .count{ font-size:0.78rem; color:#9CA3AF; }
  .chip-row.active .count{ color:var(--orange); }
  .price-range{ display:flex; flex-direction:column; gap:10px; }
  .price-range input[type=range]{ width:100%; accent-color:var(--orange); }
  .price-values{ display:flex; justify-content:space-between; font-size:0.85rem; color:var(--ink-soft); font-weight:600; }
  .star-filter{ display:flex; flex-direction:column; gap:4px; }
  .star-row{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9px; cursor:pointer; font-size:0.88rem; color:var(--ink-soft); }
  .star-row:hover{ background:var(--surface); }
  .star-row.active{ background:rgba(212,175,55,0.12); color:var(--ink); }
  .star-row .stars{ display:flex; gap:2px; color:var(--gold); }
  .star-row .stars svg{ width:13px; height:13px; }
  .clear-btn{ font-size:0.85rem; font-weight:700; color:var(--orange); background:none; border:none; cursor:pointer; padding:0; }

  /* TOOLBAR */
  .toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:14px; }
  .result-count{ font-size:0.92rem; color:var(--ink-soft); }
  .result-count strong{ color:var(--ink); }
  .sort-select{ position:relative; }
  .sort-select select{ appearance:none; background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:10px 38px 10px 14px; font-size:0.88rem; font-weight:600; cursor:pointer; }
  .sort-select::after{ content:''; position:absolute; right:14px; top:50%; width:8px; height:8px; border-inline-end:1.8px solid var(--ink-soft); border-bottom:1.8px solid var(--ink-soft); transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  .active-filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .tag-pill{ display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 8px 6px 14px; font-size:0.82rem; font-weight:600; }
  .tag-pill button{ width:18px; height:18px; border-radius:50%; background:var(--border); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .tag-pill button svg{ width:11px; height:11px; }

  /* GRID */
  .products{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  .product-card{ background:#fff; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:box-shadow .2s ease, transform .2s ease; display:flex; flex-direction:column; }
  .product-card:hover{ box-shadow:0 18px 36px -20px rgba(17,24,39,0.2); transform:translateY(-3px); }
  .product-cover{ height:150px; position:relative; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
  .product-cover .cat{ position:absolute; top:12px; inset-inline-start:12px; background:rgba(255,255,255,0.22); backdrop-filter:blur(6px); font-size:0.68rem; font-weight:700; padding:5px 10px; border-radius:999px; }
  .product-cover .fav{ position:absolute; top:12px; inset-inline-end:12px; width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.22); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; }
  .product-body{ padding:20px; display:flex; flex-direction:column; flex:1; }
  .product-title{ font-family:var(--font-head); font-weight:700; font-size:1.02rem; margin-bottom:6px; }
  .product-desc{ font-size:0.85rem; color:var(--ink-soft); line-height:1.5; margin-bottom:14px; flex:1; }
  .product-meta{ display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--ink-soft); margin-bottom:16px; flex-wrap:wrap; }
  .stars{ display:flex; align-items:center; gap:2px; color:var(--gold); }
  .stars svg{ width:13px; height:13px; }
  .product-foot{ display:flex; align-items:center; justify-content:space-between; }
  .price{ font-family:var(--font-head); font-weight:800; font-size:1.12rem; }
  .product-foot .btn{ padding:9px 16px; font-size:0.83rem; }
  .no-results{ grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--ink-soft); }
  .no-results h3{ font-size:1.2rem; color:var(--ink); margin-bottom:8px; }

  /* PAGINATION */
  .pagination{ display:flex; justify-content:center; align-items:center; gap:8px; margin-top:52px; }
  .pagination button{ width:38px; height:38px; border-radius:10px; border:1.5px solid var(--border); background:#fff; font-weight:700; font-size:0.88rem; cursor:pointer; color:var(--ink-soft); }
  .pagination button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .pagination button:hover:not(.active){ background:var(--surface); }

  footer{ padding:50px 0 30px; border-top:1px solid var(--border); text-align:center; color:var(--ink-soft); font-size:0.88rem; }
  footer a{ color:var(--orange); font-weight:600; }

  @media (max-width: 980px){
    .browse{ grid-template-columns:1fr; }
    .filters{ position:static; display:none; }
    .filters.open{ display:block; background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:10px; }
    .nav-links{ display:none; }
    .products{ grid-template-columns:repeat(2,1fr); }
    .mobile-filter-btn{ display:inline-flex !important; }
  }
  @media (max-width: 620px){
    .wrap{ padding:0 20px; }
    .products{ grid-template-columns:1fr; }
    .page-head h1{ font-size:1.8rem; }
    .toolbar{ flex-direction:column; align-items:flex-start; }
  }
  .mobile-filter-btn{ display:none; }
</style>
</head>

    title:{en:"Recommendation Letter Toolkit", fr:"Kit de lettre de recommandation", ar:"حزمة خطاب التوصية"},
    desc:{en:"Templates and a request-email script to make it easy for recommenders to say yes.",
          fr:"Modèles et un e-mail type pour faciliter la réponse positive de vos recommandataires.",
          ar:"نماذج ورسالة طلب جاهزة تسهّل على من تطلب منهم التوصية الموافقة."},
    grad:["#2563EB","#111827"]},
  {id:9, catKey:"visa", price:7, rating:3, downloads:410, popularity:60, date:26,
    title:{en:"Student Visa Interview Prep", fr:"Préparation à l'entretien du visa étudiant", ar:"تحضير مقابلة تأشيرة الطالب"},
    desc:{en:"Common consular questions and how to answer them with confidence.",
          fr:"Questions consulaires fréquentes et comment y répondre avec assurance.",
          ar:"أسئلة قنصلية شائعة وكيفية الإجابة عنها بثقة."},
    grad:["#22C55E","#16A34A"]}
];

/* ---------------- state ---------------- */
let state = { search:"", category:"all", maxPrice:30, minRating:0, sort:"popular", page:1 };
const PAGE_SIZE = 6;

function starIcon(){ return '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>'; }

function buildCatList(){
  const dict = translations[currentLang];
  const cats = ['all', 'saudi','phd','career','visa','interview','directory'];
  const list = document.getElementById('catList');
  list.innerHTML = cats.map(c=>{
    const label = c==='all' ? dict.all_cat : dict.cats[c];
    const count = c==='all' ? allProducts.length : allProducts.filter(p=>p.catKey===c).length;
    return `<div class="chip-row ${state.category===c?'active':''}" data-cat="${c}"><span>${label}</span><span class="count">${count}</span></div>`;
  }).join('');
  list.querySelectorAll('.chip-row').forEach(el=>{
    el.addEventListener('click', ()=>{ state.category = el.dataset.cat; state.page=1; render(); });
  });
}
function buildStarFilter(){
  const dict = translations[currentLang];
  const opts = [0,5,4,3];
  const wrap = document.getElementById('starFilter');
  wrap.innerHTML = opts.map(r=>{
    const label = r===0 ? dict.any_rating : `${'★'.repeat(r)} ${dict.up_and_above}`;
    const starsHtml = r===0 ? '' : `<span class="stars">${Array.from({length:r}).map(()=>starIcon()).join('')}</span>`;
    return `<div class="star-row ${state.minRating===r?'active':''}" data-r="${r}">${starsHtml}<span>${r===0?dict.any_rating:dict.up_and_above}</span></div>`;
  }).join('');
  wrap.querySelectorAll('.star-row').forEach((el,i)=>{
    el.addEventListener('click', ()=>{ state.minRating = opts[i]; state.page=1; render(); });
  });
}
function buildActiveTags(){
  const dict = translations[currentLang];
  const tags = [];
  if(state.category !== 'all') tags.push({key:'category', label: dict.cats[state.category]});
  if(state.maxPrice < 30) tags.push({key:'price', label: `≤ $${state.maxPrice}`});
  if(state.minRating > 0) tags.push({key:'rating', label: `${state.minRating}★ ${dict.up_and_above}`});
  if(state.search) tags.push({key:'search', label: `"${state.search}"`});
  const wrap = document.getElementById('activeTags');
  wrap.innerHTML = tags.map(t=>`<div class="tag-pill">${t.label}<button data-key="${t.key}"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`).join('');
  wrap.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k = b.dataset.key;
      if(k==='category') state.category='all';
      if(k==='price'){ state.maxPrice=30; document.getElementById('priceRange').value=30; }
      if(k==='rating') state.minRating=0;
      if(k==='search'){ state.search=''; document.getElementById('searchInput').value=''; }
      state.page=1; render();
    });
  });
}

function getFiltered(){
  let list = allProducts.filter(p=>{
    if(state.category !== 'all' && p.catKey !== state.category) return false;
    if(p.price > state.maxPrice) return false;
    if(p.rating < state.minRating) return false;
    if(state.search){
      const t = (p.title[currentLang] + ' ' + p.desc[currentLang]).toLowerCase();
      if(!t.includes(state.search.toLowerCase())) return false;
    }
    return true;
  });
  const sortFns = {
    popular: (a,b)=>b.popularity-a.popularity,
    new: (a,b)=>a.date-b.date,
    price_low: (a,b)=>a.price-b.price,
    price_high: (a,b)=>b.price-a.price,
    rating: (a,b)=>b.rating-a.rating
  };
  list.sort(sortFns[state.sort]);
  return list;
}

function renderGrid(){
  const dict = translations[currentLang];
  const filtered = getFiltered();
  document.getElementById('resultCount').textContent = filtered.length;
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  state.page = Math.min(state.page, totalPages);
  const pageItems = filtered.slice((state.page-1)*PAGE_SIZE, state.page*PAGE_SIZE);
  const grid = document.getElementById('productGrid');

  if(pageItems.length === 0){
    grid.innerHTML = `<div class="no-results"><h3>${dict.no_results_title}</h3><p>${dict.no_results_sub}</p></div>`;
  } else {
    grid.innerHTML = pageItems.map(p=>{
      const stars = Array.from({length:5}).map((_,i)=> `<span style="opacity:${i<p.rating?1:0.25}">${starIcon()}</span>`).join('');
      return `
      <div class="product-card">
        <div class="product-cover" style="background:linear-gradient(150deg, ${p.grad[0]}, ${p.grad[1]})">
          <span class="cat">${dict.cats[p.catKey]}</span>
          <span class="fav"><svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;color:#fff"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg></span>
          <svg class="icon" viewBox="0 0 24 24" style="width:38px;height:38px;color:rgba(255,255,255,0.85)"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <div class="product-body">
          <div class="product-title">${p.title[currentLang]}</div>
          <div class="product-desc">${p.desc[currentLang]}</div>
          <div class="product-meta"><span class="stars">${stars}</span><span>${p.rating}.0</span><span>·</span><span>${p.downloads.toLocaleString()} ${dict.results_word==='results'?'downloads':dict.results_word}</span></div>
          <div class="product-foot"><span class="price">$${p.price}</span><a href="mourischolar-product-details.html" class="btn btn-dark">${dict.view_details}</a></div>
        </div>
      </div>`;
    }).join('');
  }

  const pag = document.getElementById('pagination');
  if(totalPages <= 1){ pag.innerHTML = ''; }
  else{
    let html = '';
    for(let i=1;i<=totalPages;i++){ html += `<button class="${i===state.page?'active':''}" data-p="${i}">${i}</button>`; }
    pag.innerHTML = html;
    pag.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{ state.page = parseInt(b.dataset.p); render(); window.scrollTo({top:document.querySelector('.browse').offsetTop-100, behavior:'smooth'}); });
    });
  }
}

function render(){
  buildCatList();
  buildStarFilter();
  buildActiveTags();
  renderGrid();
}

function applyLang(lang){
  currentLang = lang;
  const dict = translations[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{ if(dict[el.getAttribute('data-i18n')] !== undefined) el.textContent = dict[el.getAttribute('data-i18n')]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = dict[el.getAttribute('data-i18n-ph')]; });
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('lang-ar', lang === 'ar');
  document.querySelectorAll('#langSwitch button').forEach(b=> b.classList.toggle('active', b.dataset.lang === lang));
  render();
}
document.getElementById('langSwitch').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(btn) applyLang(btn.dataset.lang);
});
document.getElementById('searchInput').addEventListener('input', e=>{ state.search = e.target.value; state.page=1; render(); });
document.getElementById('priceRange').addEventListener('input', e=>{ state.maxPrice = parseInt(e.target.value); document.getElementById('priceValue').textContent = '$'+state.maxPrice; render(); });
document.getElementById('sortSelect').addEventListener('change', e=>{ state.sort = e.target.value; render(); });
document.getElementById('clearFilters').addEventListener('click', ()=>{
  state = { search:"", category:"all", maxPrice:30, minRating:0, sort:"popular", page:1 };
  document.getElementById('searchInput').value=''; document.getElementById('priceRange').value=30; document.getElementById('priceValue').textContent='$30'; document.getElementById('sortSelect').value='popular';
  render();
});
document.getElementById('mobileFilterBtn').addEventListener('click', ()=>{ document.getElementById('filtersPanel').classList.toggle('open'); });

applyLang('en');
</script>
</body>
</html>
